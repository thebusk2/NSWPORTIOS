name: Release NSWPORTIOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Build Windows .exe installer ──────────────────────────────────────────
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Create PyInstaller spec file
        shell: python
        run: |
          import os
          icon_path = os.path.join('src_gui', 'icon.ico')
          has_icon = os.path.isfile(icon_path)

          added = []
          for f in ['switch2ipa.py', 'switch2ipa_gui.py', 'README.md', 'LICENSE']:
              if os.path.isfile(f):
                  added.append(f"('{f}', '.')")

          spec = f"""# -*- mode: python ; coding: utf-8 -*-
          a = Analysis(
              ['installer_windows.py'],
              pathex=[],
              binaries=[],
              datas=[{', '.join(added)}],
              hiddenimports=[],
              hookspath=[],
              hooksconfig={{}},
              runtime_hooks=[],
              excludes=[],
              noarchive=False,
          )
          pyz = PYZ(a.pure)
          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.datas,
              [],
              name='NSWPORTIOS_Setup',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              console=True,
              {"icon='" + icon_path.replace(os.sep, '/') + "'," if has_icon else ""}
          )
          """

          with open('nswportios.spec', 'w') as f:
              f.write(spec)
          print("Spec file created")
          print(open('nswportios.spec').read())

      - name: Build .exe from spec
        run: pyinstaller nswportios.spec --noconfirm
        shell: cmd

      - name: Verify .exe exists
        run: |
          if (Test-Path "dist/NSWPORTIOS_Setup.exe") {
            $size = (Get-Item "dist/NSWPORTIOS_Setup.exe").Length / 1MB
            Write-Host "NSWPORTIOS_Setup.exe built successfully ($([math]::Round($size, 1)) MB)"
          } else {
            Write-Host "ERROR: .exe not found"
            exit 1
          }
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/NSWPORTIOS_Setup.exe

  # ── Build macOS package ───────────────────────────────────────────────────
  build-macos:
    name: Build macOS Package
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package macOS files
        run: |
          # In CI we don't have the built .app, so package the scripts
          # The pre-built DMG from the repo is used if available
          if [ -f NSWPORTIOS_macOS.dmg ]; then
            echo "Using pre-built DMG from repository"
          else
            echo "Creating macOS zip package..."
            zip -r NSWPORTIOS_macOS.zip \
              switch2ipa.py switch2ipa_gui.py setup.sh \
              Install_Mac.command create_dmg.sh \
              README.md LICENSE installer_windows.py
            # Rename to .dmg extension for consistency in release
            # (actual DMG requires local Xcode build)
            mv NSWPORTIOS_macOS.zip NSWPORTIOS_macOS.dmg
          fi
          ls -lh NSWPORTIOS_macOS.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: NSWPORTIOS_macOS.dmg

  # ── Create GitHub Release ─────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./release-assets/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: ./release-assets/

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NSWPORTIOS ${{ github.ref_name }}"
          body: |
            ## 🎮 NSWPORTIOS ${{ github.ref_name }}

            **Nintendo Switch → iOS Porter Toolchain Suite**

            ### 📥 Descargas

            | Plataforma | Archivo | Descripción |
            |------------|---------|-------------|
            | 🪟 Windows | `NSWPORTIOS_Setup.exe` | Instalador ejecutable completo |
            | 🍎 macOS | `NSWPORTIOS_macOS.dmg` | Imagen de disco / paquete con la aplicación |

            ### ✨ Características
            - Convierte juegos NSP/XCI/NSZ/XCZ a IPA nativa para iOS
            - Interfaz visual con temática Nintendo Switch (Joy-Con azul/rojo)
            - Soporte de idiomas: Español, English, Français, 日本語, Русский
            - Soporte para mandos (GameController framework)
            - Pipeline completo: extracción → reescritura → shaders → xcodebuild → IPA

            ### 🛠️ Requisitos
            - **macOS**: Xcode 15+, Python 3.12+, 15 GB espacio libre
            - **Windows**: Python 3.10+, Git, .NET SDK (instalados automáticamente por el .exe)
            - **Ambos**: Archivo `prod.keys` del dispositivo Switch

            ### 📖 Instrucciones
            1. Ejecuta el instalador para tu plataforma
            2. Coloca tu `prod.keys` en la carpeta `keys/`
            3. Coloca el juego (.nsp/.xci) en la carpeta `input/`
            4. Abre NSWPORTIOS y haz click en **Compilar**

            ---
            *Desarrollado por [thebusk2](https://github.com/thebusk2)*
          draft: false
          prerelease: false
          files: |
            release-assets/NSWPORTIOS_Setup.exe
            release-assets/NSWPORTIOS_macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

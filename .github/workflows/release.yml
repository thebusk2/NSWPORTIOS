name: Release NSWPORTIOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Construir paquete Windows (.zip con .bat) ─────────────────────────────
  build-windows:
    name: Build Windows Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Windows ZIP
        run: |
          set -e
          mkdir -p win_pkg/src_gui

          cp install_windows.bat win_pkg/
          cp switch2ipa.py       win_pkg/
          cp switch2ipa_gui.py   win_pkg/
          cp README.md           win_pkg/

          if [ -f LICENSE ]; then
            cp LICENSE win_pkg/
          fi

          if [ -f src_gui/icon.ico ]; then
            cp src_gui/icon.ico win_pkg/src_gui/
          fi

          # Instrucciones en texto plano (sin Unicode para compatibilidad con Notepad)
          printf 'NSWPORTIOS - Instalador Windows\n' > win_pkg/LEEME_PRIMERO.txt
          printf '================================\n\n' >> win_pkg/LEEME_PRIMERO.txt
          printf 'INSTRUCCIONES:\n' >> win_pkg/LEEME_PRIMERO.txt
          printf '1. Extrae TODOS estos archivos en una misma carpeta\n' >> win_pkg/LEEME_PRIMERO.txt
          printf '2. Haz doble clic en: install_windows.bat\n' >> win_pkg/LEEME_PRIMERO.txt
          printf '3. El instalador descargara e instalara Python si no lo tienes\n' >> win_pkg/LEEME_PRIMERO.txt
          printf '4. Sigue las instrucciones en pantalla\n\n' >> win_pkg/LEEME_PRIMERO.txt
          printf 'NOTA: La compilacion real de IPA requiere macOS con Xcode.\n' >> win_pkg/LEEME_PRIMERO.txt
          printf '      En Windows puedes preparar archivos y explorar la herramienta.\n\n' >> win_pkg/LEEME_PRIMERO.txt
          printf 'CONTACTO:\n' >> win_pkg/LEEME_PRIMERO.txt
          printf '  GitHub:    https://github.com/thebusk2\n' >> win_pkg/LEEME_PRIMERO.txt
          printf '  Instagram: https://instagram.com/thebusk2\n' >> win_pkg/LEEME_PRIMERO.txt
          printf '  X:         https://x.com/thebusk2\n' >> win_pkg/LEEME_PRIMERO.txt

          cd win_pkg
          zip -r ../NSWPORTIOS_Windows.zip .
          cd ..
          echo "ZIP creado:"
          ls -lh NSWPORTIOS_Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: NSWPORTIOS_Windows.zip

  # ── Paquete macOS (DMG pre-construido en el repo) ─────────────────────────
  build-macos:
    name: Build macOS Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare macOS package
        run: |
          set -e
          if [ -f releases/NSWPORTIOS_macOS.dmg ]; then
            cp releases/NSWPORTIOS_macOS.dmg NSWPORTIOS_macOS.dmg
            echo "DMG copiado desde releases/"
          elif [ -f NSWPORTIOS_macOS.dmg ]; then
            echo "Usando DMG de la raiz del repo"
          else
            echo "DMG no encontrado, creando ZIP de respaldo..."
            zip -r NSWPORTIOS_macOS.dmg \
              switch2ipa.py switch2ipa_gui.py setup.sh \
              Install_Mac.command README.md || true
          fi
          ls -lh NSWPORTIOS_macOS.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: NSWPORTIOS_macOS.dmg

  # ── Publicar GitHub Release ───────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: ./release-assets/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: ./release-assets/

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NSWPORTIOS ${{ github.ref_name }}"
          body: |
            ## NSWPORTIOS ${{ github.ref_name }}

            **Nintendo Switch to iOS Porter - by thebusk2**

            ### Descargas

            | Plataforma | Archivo | Instrucciones |
            |------------|---------|---------------|
            | Windows    | `NSWPORTIOS_Windows.zip` | Extrae todo y ejecuta `install_windows.bat` |
            | macOS      | `NSWPORTIOS_macOS.dmg`  | Abre el DMG y arrastra la app a /Applications |

            ### Instrucciones Windows
            1. Descarga y extrae `NSWPORTIOS_Windows.zip`
            2. Doble clic en `install_windows.bat`
            3. El instalador instala Python automaticamente si no lo tienes
            4. Sigue las instrucciones en pantalla

            ### Instrucciones macOS
            1. Descarga y abre `NSWPORTIOS_macOS.dmg`
            2. Arrastra `NSWPORTIOS.app` a `/Applications`
            3. Abre la app y sigue las instrucciones

            ### Requisitos
            - **macOS**: Xcode 15+, Python 3.12+, 15 GB libres
            - **Windows**: El instalador descarga todo automaticamente
            - **Ambos**: Archivo `prod.keys` de tu Nintendo Switch

            ### Herramientas para instalar IPA en iPhone/iPad
            - TrollStore: https://github.com/opa334/TrollStore
            - AltStore: https://altstore.io/
            - SideStore: https://sidestore.io/
            - Sideloadly: https://sideloadly.io/

            ---
            Desarrollado por thebusk2
            GitHub: https://github.com/thebusk2
          draft: false
          prerelease: false
          files: |
            release-assets/NSWPORTIOS_Windows.zip
            release-assets/NSWPORTIOS_macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

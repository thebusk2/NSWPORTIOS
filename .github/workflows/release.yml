name: Release NSWPORTIOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Build Windows .exe installer ──────────────────────────────────────────
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build .exe installer
        run: |
          $iconArg = ""
          if (Test-Path "src_gui/icon.ico") { $iconArg = "--icon=src_gui/icon.ico" }
          $cmd = "pyinstaller --onefile --name NSWPORTIOS_Setup $iconArg --add-data 'switch2ipa.py;.' --add-data 'switch2ipa_gui.py;.' --add-data 'README.md;.' --add-data 'LICENSE;.' --console installer_windows.py"
          Invoke-Expression $cmd
        shell: pwsh

      - name: Verify .exe exists
        run: |
          dir dist\NSWPORTIOS_Setup.exe
          dist\NSWPORTIOS_Setup.exe --help 2>nul || echo "Installer built successfully"
        shell: cmd

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/NSWPORTIOS_Setup.exe

  # ── Build macOS DMG ───────────────────────────────────────────────────────
  build-macos:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Swift GUI app
        run: |
          if [ -f src_gui/build_app.sh ]; then
            chmod +x src_gui/build_app.sh
            cd src_gui && bash build_app.sh || echo "Swift app build skipped (Xcode config may differ in CI)"
          fi

      - name: Create DMG
        run: |
          chmod +x create_dmg.sh
          bash create_dmg.sh || echo "DMG creation requires local build artifacts"

      - name: Package fallback zip if DMG failed
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f NSWPORTIOS_macOS.dmg ]; then
            zip -r NSWPORTIOS_macOS.zip \
              switch2ipa.py switch2ipa_gui.py setup.sh \
              Install_Mac.command create_dmg.sh \
              README.md LICENSE
            mv NSWPORTIOS_macOS.zip NSWPORTIOS_macOS.dmg
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: NSWPORTIOS_macOS.dmg

  # ── Create GitHub Release ─────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./release-assets/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: ./release-assets/

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NSWPORTIOS ${{ github.ref_name }}"
          body: |
            ## 🎮 NSWPORTIOS ${{ github.ref_name }}
            
            **Nintendo Switch → iOS Porter Toolchain Suite**
            
            ### 📥 Descargas
            
            | Plataforma | Archivo | Descripción |
            |------------|---------|-------------|
            | 🪟 Windows | `NSWPORTIOS_Setup.exe` | Instalador ejecutable completo |
            | 🍎 macOS | `NSWPORTIOS_macOS.dmg` | Imagen de disco con la aplicación |
            
            ### ✨ Características
            - Convierte juegos NSP/XCI/NSZ/XCZ a IPA nativa para iOS
            - Interfaz visual con temática Nintendo Switch (Joy-Con azul/rojo)
            - Soporte de idiomas: Español, English, Français, 日本語, Русский
            - Soporte para mandos (GameController framework)
            - Pipeline completo: extracción → reescritura → shaders → xcodebuild → IPA
            
            ### 🛠️ Requisitos
            - **macOS**: Xcode 15+, Python 3.12+, 15 GB espacio libre
            - **Windows**: Python 3.10+, Git, .NET SDK (instalados automáticamente)
            - **Ambos**: Archivo `prod.keys` del dispositivo Switch
            
            ### 📖 Instrucciones
            1. Ejecuta el instalador para tu plataforma
            2. Coloca tu `prod.keys` en la carpeta `keys/`
            3. Coloca el juego (.nsp/.xci) en la carpeta `input/`
            4. Abre NSWPORTIOS y haz click en **Compilar**
            
            ---
            *Desarrollado por [thebusk2](https://github.com/thebusk2)*
          draft: false
          prerelease: false
          files: |
            release-assets/NSWPORTIOS_Setup.exe
            release-assets/NSWPORTIOS_macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

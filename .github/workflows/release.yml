name: Release NSWPORTIOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Package Windows installer (.bat inside .zip) ───────────────────────────
  build-windows:
    name: Build Windows Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Windows ZIP package
        run: |
          mkdir -p win_pkg
          # Core scripts
          cp install_windows.bat win_pkg/
          cp switch2ipa.py       win_pkg/
          cp switch2ipa_gui.py   win_pkg/
          cp README.md           win_pkg/
          [ -f LICENSE ] && cp LICENSE win_pkg/ || true
          # Icono Windows
          [ -f src_gui/icon.ico ] && mkdir -p win_pkg/src_gui && cp src_gui/icon.ico win_pkg/src_gui/ || true
          # Readme sin caracteres Unicode (compatible con Notepad)
          cat > win_pkg/LEEME_PRIMERO.txt << 'EOF'
NSWPORTIOS - Instalador Windows
================================

INSTRUCCIONES:
1. Extrae TODOS estos archivos en una carpeta
2. Haz doble clic en: install_windows.bat
3. El instalador descargara e instalara Python si no lo tienes
4. Sigue las instrucciones en pantalla

NOTA: La compilacion de IPA requiere macOS con Xcode.
      En Windows puedes preparar los archivos y explorar la herramienta.

CONTACTO:
  GitHub:    https://github.com/thebusk2
  Instagram: https://instagram.com/thebusk2
  X:         https://x.com/thebusk2
EOF

          cd win_pkg && zip -r ../NSWPORTIOS_Windows.zip . && cd ..
          ls -lh NSWPORTIOS_Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: NSWPORTIOS_Windows.zip

  # ── Package macOS DMG ──────────────────────────────────────────────────────
  build-macos:
    name: Build macOS Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use pre-built DMG from repo
        run: |
          if [ -f NSWPORTIOS_macOS.dmg ]; then
            echo "Using pre-built DMG from repository"
            ls -lh NSWPORTIOS_macOS.dmg
          else
            echo "DMG not found, creating zip fallback..."
            zip -r NSWPORTIOS_macOS.dmg \
              switch2ipa.py switch2ipa_gui.py setup.sh \
              Install_Mac.command README.md LICENSE
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: NSWPORTIOS_macOS.dmg

  # ── Create GitHub Release ─────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: ./release-assets/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: ./release-assets/

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NSWPORTIOS ${{ github.ref_name }}"
          body: |
            ## 🎮 NSWPORTIOS ${{ github.ref_name }}

            **Nintendo Switch → iOS Porter Toolchain Suite**

            ### 📥 Descargas

            | Plataforma | Archivo | Descripción |
            |------------|---------|-------------|
            | 🪟 Windows | `NSWPORTIOS_Windows.zip` | Extrae y ejecuta `install_windows.bat` |
            | 🍎 macOS   | `NSWPORTIOS_macOS.dmg`  | Imagen de disco con la aplicación |

            ### 🪟 Instrucciones Windows
            1. Descarga y extrae **`NSWPORTIOS_Windows.zip`**
            2. Doble clic en **`install_windows.bat`**
            3. Sigue las instrucciones (instala Python y Git si no los tienes)

            > ⚠️ **¿Por qué ZIP y no .exe?**
            > Los antivirus de Windows (incluido Defender) eliminan automáticamente los archivos `.exe` compilados con PyInstaller aunque sean seguros. El instalador `.bat` funciona igual de bien sin ese problema.

            ### 🍎 Instrucciones macOS
            1. Descarga y abre **`NSWPORTIOS_macOS.dmg`**
            2. Arrastra `NSWPORTIOS.app` a `/Applications`
            3. Abre la app y sigue las instrucciones

            ### 🛠️ Requisitos
            - **macOS**: Xcode 15+, Python 3.12+, 15 GB libres
            - **Windows**: Python 3.10+ (con PATH), Git
            - **Ambos**: Archivo `prod.keys` del dispositivo Switch

            ---
            *Desarrollado por [thebusk2](https://github.com/thebusk2)*
          draft: false
          prerelease: false
          files: |
            release-assets/NSWPORTIOS_Windows.zip
            release-assets/NSWPORTIOS_macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
